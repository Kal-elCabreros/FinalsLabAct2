<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Checker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Score Checker</h1>
      <p class="subtitle">Enter your name and score to see your result.</p>

      <button id="startBtn">Start</button>

      <div id="result" class="result hidden">
        <p id="nameOutput"></p>
        <p id="scoreOutput"></p>
        <p id="remarkOutput" class="remark"></p>
      </div>
    </div>

    <script src="javascript.js"></script>
  </body>
</html>
